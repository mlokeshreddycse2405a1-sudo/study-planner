<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Study Planner | Student Dashboard</title>
    <meta
      name="description"
      content="Study Planner dashboard for managing subjects, tasks, priorities, and study progress."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header dashboard-header">
      <nav class="navbar container" aria-label="Dashboard navigation">
        <a href="index.html" class="brand" aria-label="Study Planner home">Study Planner</a>
<div class="nav-links">
  <a href="index.html">Home</a>
  <a href="#dashboard-overview">Overview</a>
  <a href="#tasks">Tasks</a>
  <a href="#progress-heading">Progress</a>
</div>

              <div class="profile-badge" aria-label="Student profile">
          <span class="profile-dot">S</span>
          <span>Student</span>
        </div>
      </nav>
    </header>

    <main id="dashboard-overview" class="dashboard-main container">
      <section class="welcome-section">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>Welcome back, Student!</h1>
        </div>
        <p class="welcome-message">Keep going — every focused session brings you closer to your goals.</p>
      </section>

      <section class="stats-grid" aria-label="Study statistics">
        <article class="stat-card">
          <span class="stat-label">Total Tasks</span>
          <strong id="totalTasks">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Completed</span>
          <strong id="completedTasks">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Pending</span>
          <strong id="pendingTasks">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Progress</span>
          <strong id="progressValue">0%</strong>
        </article>
      </section>

      <section class="dashboard-layout">
        <div class="panel">
          <section class="task-form-section" aria-labelledby="add-task-heading">
            <div class="section-heading inline-heading">
              <h2 id="add-task-heading">Add Study Task</h2>
            </div>

            <form id="task-form" novalidate>
              <div class="form-grid">
                <div class="field-group">
                  <label for="taskName">Task name</label>
                  <input id="taskName" name="taskName" type="text" placeholder="e.g. Review DevOps notes" required />
                </div>

                <div class="field-group">
                  <label for="subject">Subject</label>
                  <input id="subject" name="subject" type="text" placeholder="e.g. Operating Systems" required />
                </div>

                <div class="field-group">
                  <label for="taskDate">Date</label>
                  <input id="taskDate" name="taskDate" type="date" required />
                </div>

                <div class="field-group">
                  <label for="priority">Priority</label>
                  <select id="priority" name="priority" required>
                    <option value="">Select priority</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-primary task-submit">Add Task</button>
            </form>
          </section>
        </div>

        <div class="panel tasks-panel" id="tasks">
          <div class="section-header tasks-header">
            <h2>Task List</h2>
            <div class="filter-group" aria-label="Filter tasks">
              <button class="filter-btn active" type="button" data-filter="all">All</button>
              <button class="filter-btn" type="button" data-filter="pending">Pending</button>
              <button class="filter-btn" type="button" data-filter="completed">Completed</button>
            </div>
          </div>

          <div id="taskList" class="task-list" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel progress-panel" aria-labelledby="progress-heading">
        <div class="section-header">
          <h2 id="progress-heading">Progress</h2>
        </div>
        <div class="progress-meta">
          <span id="progressText">0%</span>
        </div>
        <div class="progress-bar" aria-label="Task progress bar" aria-valuemin="0" aria-valuemax="100">
          <div id="progressBar" class="progress-fill" style="width: 0%"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
